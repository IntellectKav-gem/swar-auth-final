<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1528" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050811" stop-opacity="1" />
    </radialGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FD8E0" />
      <stop offset="50%" stop-color="#00F5E4" />
      <stop offset="100%" stop-color="#4E8CFF" />
    </linearGradient>

    <!-- Glowing Blue Gradient -->
    <linearGradient id="neonBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E8CFF" />
      <stop offset="100%" stop-color="#3FD8E0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="90" fill="url(#bgGlow)" />
  <rect width="496" height="496" x="2" y="2" rx="88" fill="none" stroke="url(#neonCyan)" stroke-opacity="0.25" stroke-width="2" />

  <g transform="translate(0, -10)">
    <!-- Outer Shield Border -->
    <path d="M 250 80 
             L 370 125 
             C 370 260, 320 350, 250 400 
             C 180 350, 130 260, 130 125 
             Z" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="5" 
          filter="url(#glowEffect)" />

    <!-- Inner Shield Accent Line -->
    <path d="M 250 96 
             L 354 135 
             C 354 250, 310 332, 250 378 
             C 190 332, 146 250, 146 135 
             Z" 
          fill="rgba(8, 18, 38, 0.6)" 
          stroke="url(#neonBlue)" 
          stroke-width="2" 
          stroke-dasharray="8 4"
          opacity="0.8" />

    <!-- Acoustic Microphone Emblem Center -->
    <!-- Mic Body -->
    <rect x="222" y="160" width="56" height="95" rx="28" fill="rgba(5, 12, 24, 0.9)" stroke="url(#neonCyan)" stroke-width="4" filter="url(#subtleGlow)" />
    
    <!-- Mic Mesh Lines -->
    <line x1="230" y1="180" x2="270" y2="180" stroke="#3FD8E0" stroke-width="2" opacity="0.6" />
    <line x1="226" y1="195" x2="274" y2="195" stroke="#3FD8E0" stroke-width="2" opacity="0.6" />
    <line x1="230" y1="210" x2="270" y2="210" stroke="#3FD8E0" stroke-width="2" opacity="0.6" />

    <!-- Mic Arc Stand -->
    <path d="M 205 210 C 205 275, 295 275, 295 210" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" filter="url(#subtleGlow)" />
    <!-- Mic Stem & Base -->
    <line x1="250" y1="262" x2="250" y2="295" stroke="url(#neonCyan)" stroke-width="4" />
    <line x1="225" y1="295" x2="275" y2="295" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" />

    <!-- Dynamic Soundwave Frequency Graph crossing shield -->
    <path d="M 80 240 
             Q 120 240, 140 210 
             T 170 270 
             T 200 220 
             T 230 250 
             T 250 190 
             T 270 290 
             T 300 210 
             T 330 270 
             T 360 220 
             Q 380 240, 420 240" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="5" 
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#glowEffect)" />
  </g>

  <!-- Typography Brand Banner -->
  <text x="250" y="445" text-anchor="middle" fill="#EAEEF7" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="800" font-size="34" letter-spacing="4">SWAR-AUTH</text>
  <text x="250" y="472" text-anchor="middle" fill="#3FD8E0" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="13" letter-spacing="3" opacity="0.9">VOICE BIOMETRIC AUTHENTICATION</text>
</svg>
